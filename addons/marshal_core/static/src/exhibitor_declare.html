<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marshal — Declare a shipment</title>
<style>
:root{
  --bg:#FAF8F4; --ink:#1C1F26; --blue:#2A5FA3; --amber:#C98A2C; --green:#3E7A5C;
  --hair:#E5E0D6; --dim:#6B6558;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:"Public Sans","Work Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;display:flex;justify-content:center;padding:2.5rem 1.25rem}
.card{width:100%;max-width:480px}
h1{font-family:var(--serif);font-size:1.9rem;font-weight:600;margin-bottom:.35rem}
.sub{color:var(--dim);font-size:.95rem;margin-bottom:2rem}
label{display:block;font-size:.82rem;font-weight:600;color:var(--dim);
  margin:1.1rem 0 .35rem;text-transform:uppercase;letter-spacing:.03em}
input{width:100%;padding:.75rem .85rem;border:1px solid var(--hair);
  border-radius:10px;font-size:1rem;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;gap:.75rem}
.row > div{flex:1}
button{width:100%;margin-top:1.75rem;padding:.95rem;border:none;
  border-radius:10px;background:var(--blue);color:#fff;font-size:1.05rem;
  font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.result{margin-top:1.75rem;padding:1.1rem;border-radius:10px;
  background:#EAF1E9;border:1px solid var(--green);display:none}
.result.show{display:block}
.result a{color:var(--blue);font-weight:600;word-break:break-all}
.error{margin-top:1rem;color:#B23A2E;font-size:.9rem;display:none}
.error.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Declare a shipment</h1>
  <div class="sub">Tell us what's coming and we'll schedule the dock. Takes about a minute.</div>

  <form id="f">
    <label for="exhibitor_name">Company / exhibitor name</label>
    <input id="exhibitor_name" required placeholder="Acme Co.">

    <label for="booth">Booth number</label>
    <input id="booth" required placeholder="412">

    <div class="row">
      <div>
        <label for="carrier">Carrier</label>
        <input id="carrier" placeholder="RainFreight Logistics">
      </div>
      <div>
        <label for="driver_phone">Driver's mobile</label>
        <input id="driver_phone" placeholder="+1 416 555 0123">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="window_start">Expected — earliest</label>
        <input id="window_start" type="datetime-local">
      </div>
      <div>
        <label for="window_end">Expected — latest</label>
        <input id="window_end" type="datetime-local">
      </div>
    </div>

    <button type="submit" id="submit">Declare shipment</button>
  </form>

  <div class="error" id="error"></div>
  <div class="result" id="result">
    <div>Shipment declared. Save this link to track it and to text your driver:</div>
    <div style="margin-top:.5rem"><a id="trackLink" href="#"></a></div>
  </div>
</div>

<script>
// Generated once per page load, reused for every retry of THIS submission —
// a double-click or a dropped-response retry must not create two shipments.
// A genuinely new declaration only happens after a page reload, which gets
// a fresh key naturally.
const idempotencyKey = crypto.randomUUID();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const err = document.getElementById('error');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Declaring…';

  const toIso = (v) => v ? new Date(v).toISOString() : null;
  const params = {
    exhibitor_name: document.getElementById('exhibitor_name').value.trim(),
    booth: document.getElementById('booth').value.trim(),
    carrier: document.getElementById('carrier').value.trim() || null,
    driver_phone: document.getElementById('driver_phone').value.trim() || null,
    window_start: toIso(document.getElementById('window_start').value),
    window_end: toIso(document.getElementById('window_end').value),
    idempotency_key: idempotencyKey,
  };

  try{
    const res = await fetch('/marshal/exhibitor/declare/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({jsonrpc:'2.0', method:'call', params}),
    });
    const data = await res.json();
    const result = data.result;
    if(!result || !result.ok){
      throw new Error((result && result.error) || 'Something went wrong');
    }
    const link = window.location.origin + result.track_url;
    document.getElementById('trackLink').textContent = link;
    document.getElementById('trackLink').href = link;
    document.getElementById('result').classList.add('show');
    document.getElementById('f').style.display = 'none';
  } catch(ex){
    err.textContent = 'Could not declare that shipment — check the required fields and try again.';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Declare shipment';
  }
});
</script>
</body>
</html>
